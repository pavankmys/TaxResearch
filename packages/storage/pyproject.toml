[build-system]
requires = ["setuptools>=67.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taxresearch-storage"
version = "0.1.0"
description = "Object storage (local folder and S3) shared by the TaxResearch worker and API"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.28.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
taxresearch_storage = ["py.typed"]
