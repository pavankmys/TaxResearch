[build-system]
requires = ["setuptools>=67.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-core"
version = "0.1.0"
description = "Core legal citation and ID parsing for GST Tax Research"
requires-python = ">=3.12"
dependencies = [
    "lark>=1.1.9",
    "pyyaml>=6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
