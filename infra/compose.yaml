version: '3.8'

services:
  postgres:
    image: docker.io/library/postgres:16
    container_name: taxresearch-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:5432:5432
    restart: unless-stopped
    command: >
      postgres
      -c shared_preload_libraries=btree_gist

  minio:
    image: docker.io/minio/minio:RELEASE.2024-10-02T17-50-41Z
    container_name: taxresearch-minio
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    ports:
      - 127.0.0.1:9000:9000
      - 127.0.0.1:9001:9001
    restart: unless-stopped
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  minio-init:
    image: docker.io/minio/mc:RELEASE.2024-10-02T16-57-35Z
    container_name: taxresearch-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: >
      sh -c "
        until /usr/bin/mc alias set minio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
          echo 'Waiting for MinIO...'
          sleep 1
        done;
        /usr/bin/mc mb minio/$$S3_BUCKET --ignore-existing;
        /usr/bin/mc version enable minio/$$S3_BUCKET || true;
        echo 'MinIO bucket created'
      "
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: taxresearch-api
    depends_on:
      - postgres
      - minio-init
    environment:
      DATABASE_URL: ${DATABASE_URL}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      JWT_SECRET: ${JWT_SECRET}
      LOG_LEVEL: ${LOG_LEVEL}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - 127.0.0.1:8000:8000
    restart: unless-stopped
    env_file: ../.env

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    container_name: taxresearch-worker
    depends_on:
      - postgres
      - minio-init
    environment:
      DATABASE_URL: ${DATABASE_URL}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      LOG_LEVEL: ${LOG_LEVEL}
      WATCH_FOLDER: /watch
    volumes:
      - ./watch:/watch:Z
    restart: unless-stopped
    env_file: ../.env

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: taxresearch-web
    depends_on:
      - api
    environment:
      API_URL: http://api:8000
      NODE_ENV: production
      # The session cookie is Secure by default. Local http runs need COOKIE_SECURE=false.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    ports:
      - 127.0.0.1:3000:3000
    restart: unless-stopped
    env_file: ../.env

volumes:
  pgdata:
    driver: local
  minio-data:
    driver: local
