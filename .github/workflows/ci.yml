name: CI

# CI minutes are limited: run on PRs, merges to main, and on demand only.
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

# A newer run for the same branch or PR cancels the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  python:
    runs-on: ubuntu-latest
    name: Python lint, type check, and tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install packages (editable mode)
        run: |
          # Install any packages that have pyproject.toml
          find . -maxdepth 3 -name "pyproject.toml" -path "*/apps/*" -o -name "pyproject.toml" -path "*/packages/*" | \
            xargs -I {} sh -c 'pip install -e "$(dirname {})"'

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Format check with ruff
        run: |
          ruff format --check .

      - name: Type check with mypy
        run: |
          mypy

      - name: Test with pytest
        run: |
          pytest -m "not integration" --tb=short

  web:
    runs-on: ubuntu-latest
    name: Web lint, type check, tests and build

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix apps/web

      - name: Lint
        run: npm --prefix apps/web run lint

      - name: Type check
        run: npm --prefix apps/web run typecheck

      - name: Unit tests
        run: npm --prefix apps/web test

      - name: Build
        run: npm --prefix apps/web run build

  integration:
    runs-on: ubuntu-latest
    name: Integration tests

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taxresearch_test
          POSTGRES_PASSWORD: test-password-ci
          POSTGRES_DB: taxresearch_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install packages (editable mode)
        run: |
          find . -maxdepth 3 -name "pyproject.toml" -path "*/apps/*" -o -name "pyproject.toml" -path "*/packages/*" | \
            xargs -I {} sh -c 'pip install -e "$(dirname {})"'

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://taxresearch_test:test-password-ci@localhost:5432/taxresearch_test
        run: |
          pytest -m "integration" --tb=short

  e2e:
    # Runs only on pull requests, to keep CI minutes low (see docs in README: Reviewer console).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: End-to-end tests (Playwright)
    needs: [python, web]
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taxresearch_test
          POSTGRES_PASSWORD: test-password-ci
          POSTGRES_DB: taxresearch_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install packages (editable mode)
        run: |
          find . -maxdepth 3 -name "pyproject.toml" -path "*/apps/*" -o -name "pyproject.toml" -path "*/packages/*" | \
            xargs -I {} sh -c 'pip install -e "$(dirname {})"'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix apps/web

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Start the stack
        env:
          DATABASE_URL: postgresql://taxresearch_test:test-password-ci@localhost:5432/taxresearch_test
          PYTHON: python
        run: scripts/e2e-stack.sh

      - name: Run Playwright tests
        working-directory: apps/web
        env:
          CI: "true"
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: scripts/e2e-stack.sh stop
