# Citation alias table (TSD section 5.4, 6.3)
# Maintained by domain experts; used by the citation parser for normalization
# This is the MVP minimal set; full list is expert-maintained (A-26)

# Notification series codes (commonly used in queries)
notification_series:
  - code: CT
    aliases:
      - Central Tax
      - ct
    description: Central Tax Notifications

  - code: CT(R)
    aliases:
      - "Central Tax (Rate)"
      - "ct(r)"
      - "ctr"
    description: Central Tax Rate Notifications

  # DRAFT — needs expert review (A-26)
  - code: IT
    aliases:
      - "Integrated Tax"
      - "it"
    description: Integrated Tax Notifications

  # DRAFT — needs expert review (A-26)
  - code: IT(R)
    aliases:
      - "Integrated Tax (Rate)"
      - "it(r)"
    description: Integrated Tax Rate Notifications

  # DRAFT — needs expert review (A-26)
  - code: UT
    aliases:
      - "Union Territory Tax"
      - "ut"
    description: Union Territory Tax Notifications

  # DRAFT — needs expert review (A-26)
  - code: UT(R)
    aliases:
      - "Union Territory Tax (Rate)"
      - "ut(r)"
    description: Union Territory Tax Rate Notifications

  # DRAFT — needs expert review (A-26)
  - code: COMP
    aliases:
      - "Compensation Cess"
      - "comp"
    description: Compensation Cess Notifications

  # DRAFT — needs expert review (A-26)
  - code: COMP(R)
    aliases:
      - "Compensation Cess (Rate)"
      - "comp(r)"
    description: Compensation Cess Rate Notifications

# Act abbreviations
act_aliases:
  - full_name: CGST Act, 2017
    codes:
      - CGST
      - CGST Act
      - central GST act
    release: MVP

  - full_name: IGST Act, 2016
    codes:
      - IGST
      - IGST Act
      - integrated GST act
    release: MVP

  # TODO: Add UTGST, Compensation Cess Act, Rules abbreviations

# Rules abbreviations
rules_aliases:
  - full_name: CGST Rules, 2017
    codes:
      - CGST Rules
      - cgst rules
    release: MVP

  - full_name: IGST Rules, 2017
    codes:
      - IGST Rules
      - igst rules
    release: MVP

# Reporter case citations (for judgement lookup)
# TODO: Add patterns for All India Reporter, Supreme Court Reporter, etc.
reporters: []

# Case number patterns for judgement metadata (M3, TSD 5.6). Each entry has a short form
# (abbr) and a regex with named groups number and year.
# DRAFT — needs expert review (A-26)
case_number_patterns:
  - abbr: CA
    pattern: "Civil\\s+Appeal\\s+No\\.?\\s*(?P<number>\\d+)\\s+of\\s+(?P<year>\\d{4})"
  - abbr: SLP(C)
    pattern: "SLP\\s*\\(C\\)\\s*No\\.?\\s*(?P<number>\\d+)\\s+of\\s+(?P<year>\\d{4})"
  - abbr: WP(C)
    pattern: "W\\.?\\s*P\\.?\\s*\\(C\\)\\s*No\\.?\\s*(?P<number>\\d+)\\s*(?:/|of)\\s*(?P<year>\\d{4})"
  - abbr: WP
    pattern: "Writ\\s+Petition\\s+No\\.?\\s*(?P<number>\\d+)\\s+of\\s+(?P<year>\\d{4})"
  - abbr: TA
    pattern: "Tax\\s+Appeal\\s+No\\.?\\s*(?P<number>\\d+)\\s+of\\s+(?P<year>\\d{4})"
